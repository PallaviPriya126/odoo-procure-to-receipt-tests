name: Odoo end-to-end tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      ODOO_URL: http://localhost:8069
      ODOO_DB: p2p
      ODOO_USER: admin
      ODOO_PASSWORD: admin
      PG_HOST: localhost
      PG_PORT: 5432
      PG_USER: odoo
      PG_PASSWORD: odoo
      PG_DATABASE: p2p
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Start PostgreSQL
        run: docker compose up -d db
      - name: Create Odoo database with Purchase and Inventory
        run: docker compose run --rm odoo odoo -d p2p -i purchase,stock --stop-after-init
      - name: Start Odoo
        run: docker compose up -d odoo
      - name: Wait for Odoo
        run: |
          for i in $(seq 1 60); do
            if curl -sf "$ODOO_URL/web/login" > /dev/null; then exit 0; fi
            sleep 5
          done
          docker compose logs odoo
          exit 1
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run tests
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
